# Local hooks via uv so versions match pyproject.toml / uv.lock.
# Install:  uv sync --all-groups && uv run pre-commit install
# Manual run: uv run pre-commit run --all-files

default_language_version:
  python: python3.13

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix
        entry: uv run ruff check --fix src
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format src
        language: system
        pass_filenames: false
        always_run: true

      - id: basedpyright
        name: basedpyright
        entry: >-
          uv run basedpyright
          src/zh/cli
          src/zh/commands
          src/zh/issue_ops.py
          src/zh/workspace_ops.py
          src/zh/gh_ops.py
          src/zh/planning_ops.py
          src/zh/deps_ops.py
          src/zh/types.py
          src/zh/schemas.py
          src/zh/json_helpers.py
        language: system
        pass_filenames: false
        always_run: true
