# Continuous integration: Python lint, typecheck, and tests (uv).

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@3b5b9329f8b0348e98550618ad5ad8a8e2d3a1b0 # v5.3.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Ruff check
        run: uv run ruff check src

      - name: Ruff format check
        run: uv run ruff format --check src

      - name: Basedpyright (strict)
        run: uv run basedpyright src/zh/cli src/zh/commands src/zh/issue_ops.py src/zh/workspace_ops.py src/zh/gh_ops.py src/zh/planning_ops.py src/zh/deps_ops.py src/zh/types.py src/zh/schemas.py src/zh/json_helpers.py

      - name: CLI smoke test
        run: uv run zh version

      - name: Run pytest
        run: uv run pytest tests/ -v
